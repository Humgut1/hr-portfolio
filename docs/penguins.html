<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>펭귄 모음</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root { --bg: #FAF8F4; --fg: #1E2430; --muted: #5F6675; --line: #DAD5CB; --ink: #1E2430; --ink-muted: #4B5261; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #15171C; --fg: #F1EEE8; --muted: #A9A6A0; --line: #343843; } }
:root[data-theme="dark"] { --bg: #15171C; --fg: #F1EEE8; --muted: #A9A6A0; --line: #343843; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; line-height: 1.6; word-break: keep-all; }
.wrap { max-width: 1040px; margin-inline: auto; padding: 40px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
h1 { margin: 0 0 6px; font-family: "Jua", sans-serif; font-weight: 400; font-size: clamp(30px, 6vw, 44px); line-height: 1.2; }
.lead { margin: 0 0 40px; color: var(--muted); }
h2 { margin: 48px 0 4px; font-size: 20px; }
.sub { margin: 0 0 18px; color: var(--muted); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; }
figure { margin: 0; padding: 16px 16px 18px; border-radius: 16px; color: var(--ink); text-align: center; }
figure svg { display: block; width: 100%; height: auto; overflow: visible; }
figure b { display: block; margin-top: 8px; font-family: "Jua", sans-serif; font-weight: 400; font-size: 20px; }
figure span { display: block; font-size: 13px; color: var(--ink-muted); }
figure em { display: inline-block; margin-top: 8px; padding: 2px 10px; border-radius: 99px; background: #FFFFFF; font-style: normal; font-size: 12px; font-weight: 700; }
figure.wide { grid-column: span 2; }
@media (max-width: 480px) { figure.wide { grid-column: auto; } }
</style>

<div class="wrap">
  <h1>펭귄 모음</h1>
  <p class="lead">지금까지 그린 펭귄을 한자리에 모았습니다. 위 넷은 시안에 들어가 있고, 아래 다섯은 스케치만 했습니다.</p>

  <h2>시안에 쓰는 펭귄</h2>
  <p class="sub">밖은 보는 사람, 안은 지원자인 나입니다.</p>
  <div class="grid" id="live"></div>

  <h2>스케치만 한 펭귄</h2>
  <p class="sub">컨셉을 고르면서 그려 본 것들입니다. 시안에는 없습니다.</p>
  <div class="grid" id="sketch"></div>
</div>

<script>
const feet = '<ellipse cx="145" cy="298" rx="20" ry="8" fill="#F2A33A"/><ellipse cx="195" cy="298" rx="20" ry="8" fill="#F2A33A"/>';
const body = '<ellipse cx="170" cy="200" rx="80" ry="98" fill="#1E2430"/><ellipse cx="170" cy="152" rx="52" ry="36" fill="#F7F5F0"/>';
const belly = '<ellipse cx="170" cy="222" rx="54" ry="72" fill="#F7F5F0"/>';
const beak = '<path d="M161 166H179L170 175Z" fill="#F2A33A" stroke="#C97F1E" stroke-width="1.5" stroke-linejoin="round"/>';
const eyes = '<circle cx="150" cy="150" r="4" fill="#1E2430"/><circle cx="190" cy="150" r="4" fill="#1E2430"/>';
const blush = '<ellipse cx="134" cy="166" rx="7" ry="4" fill="#F4B6A6"/><ellipse cx="206" cy="166" rx="7" ry="4" fill="#F4B6A6"/>';
const flipL = '<ellipse cx="94" cy="222" rx="13" ry="38" transform="rotate(14 94 222)" fill="#1E2430" stroke="#465066" stroke-width="2"/>';
const flipR = '<ellipse cx="246" cy="222" rx="13" ry="38" transform="rotate(-14 246 222)" fill="#1E2430" stroke="#465066" stroke-width="2"/>';
const flipUp = '<ellipse cx="236" cy="180" rx="13" ry="38" transform="rotate(-36 236 180)" fill="#1E2430" stroke="#465066" stroke-width="2"/>';
const collarTie = '<path d="M148 190L168 198L157 210Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="2" stroke-linejoin="round"/><path d="M192 190L172 198L183 210Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="2" stroke-linejoin="round"/><path d="M163 197H177L174 207H166Z" fill="#1F4E9C"/><path d="M166 207H174L179 244L170 254L161 244Z" fill="#1F4E9C"/>';
const glint = '<path d="M164 149H176" stroke="#1E2430" stroke-width="3" fill="none"/><path d="M124 138L164 143L162 161L129 159Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="3" stroke-linejoin="round"/><path d="M216 138L176 143L178 161L211 159Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="3" stroke-linejoin="round"/><path d="M134 156L144 143M142 157L152 144" stroke="#BFD3F2" stroke-width="2" fill="none"/>';
const sparks = '<path d="M226 112L230 126L244 130L230 134L226 148L222 134L208 130L222 126Z" fill="#FFFFFF" stroke="#1F4E9C" stroke-width="1.5" stroke-linejoin="round"/><path d="M252 104L254 111L261 113L254 115L252 122L250 115L243 113L250 111Z" fill="#FFFFFF" stroke="#1F4E9C" stroke-width="1.5" stroke-linejoin="round"/>';
const resume = '<g transform="rotate(-8 80 256)"><rect x="66" y="238" width="28" height="36" rx="2" fill="#FFFFFF" stroke="#1E2430" stroke-width="2"/><path d="M71 247H82M71 254H89M71 260H89M71 266H85" stroke="#8FA3C4" stroke-width="2" fill="none"/></g>';
const sweat = '<path d="M234 126C229 136 229 143 234 143C239 143 239 136 234 126Z" fill="#7FB7E6"/>';
const cowlick = '<path d="M166 105C160 88 172 80 184 86C177 89 175 96 178 105Z" fill="#1E2430"/>';
const roundGlasses = '<circle cx="150" cy="150" r="14" fill="none" stroke="#1E2430" stroke-width="3"/><circle cx="190" cy="150" r="14" fill="none" stroke="#1E2430" stroke-width="3"/><path d="M164 150H176" stroke="#1E2430" stroke-width="3" fill="none"/>';
const headGlasses = '<path d="M164 108H176" stroke="#F7F5F0" stroke-width="3" fill="none"/><path d="M130 100L164 103L162 116L134 115Z" fill="#3A4660" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/><path d="M210 100L176 103L178 116L206 115Z" fill="#3A4660" stroke="#F7F5F0" stroke-width="2.5" stroke-linejoin="round"/>';
const mug = '<path d="M267 246a7 7 0 010 14" fill="none" stroke="#3A2A1E" stroke-width="3"/><rect x="242" y="238" width="26" height="28" rx="5" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="2"/><path d="M250 230q4-6 0-12M260 230q4-6 0-12" fill="none" stroke="#8A5A3C" stroke-width="2" stroke-linecap="round"/>';
const jacket = (c, s) => `<path d="M96 215C104 190 136 184 170 184C204 184 236 190 244 215C252 250 240 290 170 292C100 290 88 250 96 215Z" fill="${c}" stroke="${s}" stroke-width="2"/>`;
const sleeves = (c, s) => `<ellipse cx="92" cy="226" rx="14" ry="36" transform="rotate(14 92 226)" fill="${c}" stroke="${s}" stroke-width="2"/><ellipse cx="248" cy="226" rx="14" ry="36" transform="rotate(-14 248 226)" fill="${c}" stroke="${s}" stroke-width="2"/>`;
const vFront = '<path d="M152 185L170 232L188 185Z" fill="#F7F5F0" stroke="#3A2A1E" stroke-width="2" stroke-linejoin="round"/><path d="M170 232V290" stroke="#3A2A1E" stroke-width="2" fill="none"/><circle cx="170" cy="248" r="3" fill="#3A2A1E"/>';
const svg = (inner, vb) => `<svg viewBox="${vb || '50 78 240 232'}" role="img" aria-hidden="true">${inner}</svg>`;

const live = [
  { name: '면접관 펭귄', note: '짧은 날개로 안경 척, 렌즈 반짝', tag: '밖 · 일로 왔어요', bg: '#DCE5F2',
    art: svg(feet + body + belly + flipL + flipUp + beak + collarTie + glint + sparks) },
  { name: '커피챗 상대 펭귄', note: '카디건, 동그란 안경, 머그잔', tag: '밖 · 커피챗 하러 왔어요', bg: '#F3E3CF',
    art: svg(feet + body + jacket('#C98B5A', '#3A2A1E') + vFront + sleeves('#C98B5A', '#3A2A1E') + mug + beak + eyes + blush + roundGlasses) },
  { name: '지원자 펭귄 (나)', note: '넥타이, 이력서, 식은땀 한 방울', tag: '안 · 격식 모드', bg: '#DCE5F2',
    art: svg(feet + body + belly + flipL + flipR + beak + eyes + blush + collarTie + resume + sweat + cowlick) },
  { name: '커피챗 펭귄 (나)', note: '주황 후드티, 커피 들고 기다리는 중', tag: '안 · 편안 모드', bg: '#FFD9B8',
    art: svg(feet + body + jacket('#E2703A', '#3A2A1E') + vFront + sleeves('#E2703A', '#3A2A1E') + mug + beak + eyes + blush + cowlick) }
];

const sketch = [
  { name: '후드티 펭귄', note: '처음 그린 편안 모드, 안경은 머리 위', bg: '#FFD9B8',
    art: svg(feet + body + jacket('#E2703A', '#3A2A1E') + '<path d="M140 250H200L205 280H135Z" fill="#C4501B"/><path d="M160 190V214M180 190V214" stroke="#FFF4E6" stroke-width="3" stroke-linecap="round" fill="none"/>' + sleeves('#E2703A', '#3A2A1E') + beak + eyes + blush + headGlasses) },
  { name: '퇴근 펭귄', note: '후드집업, 풀린 넥타이, 캔 음료', bg: '#FFD9B8',
    art: svg(feet + body + jacket('#E2703A', '#3A2A1E') + '<path d="M156 185H184L192 291H148Z" fill="#F7F5F0" stroke="#3A2A1E" stroke-width="2" stroke-linejoin="round"/><g transform="rotate(9 170 210)"><path d="M164 204H176L174 213H166Z" fill="#1F4E9C"/><path d="M166 213H174L180 246L171 255L163 246Z" fill="#1F4E9C"/></g>' + sleeves('#E2703A', '#3A2A1E') + '<rect x="250" y="244" width="18" height="28" rx="4" fill="#7FB7E6" stroke="#3A2A1E" stroke-width="2"/>' + beak + eyes + blush + headGlasses) },
  { name: '러닝 펭귄', note: '트레이닝복, 헤어밴드, 짧은 다리', bg: '#CFEDE6',
    art: svg('<ellipse cx="140" cy="298" rx="20" ry="8" fill="#F2A33A"/><ellipse cx="204" cy="286" rx="20" ry="8" transform="rotate(-25 204 286)" fill="#F2A33A"/>' + body + jacket('#2F9E8F', '#16443D') + '<path d="M170 186V290" stroke="#F7F5F0" stroke-width="3" fill="none"/><path d="M112 262H228M108 250H232" stroke="#F7F5F0" stroke-width="3" fill="none"/><ellipse cx="88" cy="214" rx="14" ry="36" transform="rotate(55 88 214)" fill="#2F9E8F" stroke="#16443D" stroke-width="2"/><ellipse cx="252" cy="214" rx="14" ry="36" transform="rotate(55 252 214)" fill="#2F9E8F" stroke="#16443D" stroke-width="2"/>' + beak + '<path d="M143 151L157 147M197 151L183 147" stroke="#1E2430" stroke-width="4" stroke-linecap="round" fill="none"/>' + blush + '<path d="M112 132Q170 104 228 132" stroke="#E24B4A" stroke-width="9" stroke-linecap="round" fill="none"/><path d="M262 140C258 148 258 154 262 154C266 154 266 148 262 140Z" fill="#7FB7E6"/><path d="M276 162C272 170 272 176 276 176C280 176 280 170 276 162Z" fill="#7FB7E6"/><path d="M52 226H74M46 242H70M56 258H76" stroke="#16443D" stroke-width="3" stroke-linecap="round" fill="none"/>', '40 78 250 232') },
  { name: '집콕 펭귄', note: '담요 뒤집어쓰고 귤', bg: '#F6E7B8',
    art: svg('<ellipse cx="145" cy="300" rx="20" ry="8" fill="#F2A33A"/><ellipse cx="195" cy="300" rx="20" ry="8" fill="#F2A33A"/><path d="M82 300C74 200 96 96 170 92C244 96 266 200 258 300Z" fill="#F2B84B" stroke="#3A2A1E" stroke-width="2" stroke-linejoin="round"/><circle cx="112" cy="230" r="5" fill="#FFF4E6"/><circle cx="228" cy="236" r="5" fill="#FFF4E6"/><circle cx="130" cy="270" r="5" fill="#FFF4E6"/><circle cx="212" cy="274" r="5" fill="#FFF4E6"/><circle cx="170" cy="112" r="5" fill="#FFF4E6"/><circle cx="110" cy="180" r="5" fill="#FFF4E6"/><circle cx="232" cy="184" r="5" fill="#FFF4E6"/><ellipse cx="170" cy="154" rx="60" ry="44" fill="#1E2430"/><ellipse cx="170" cy="156" rx="50" ry="34" fill="#F7F5F0"/><path d="M161 168H179L170 177Z" fill="#F2A33A" stroke="#C97F1E" stroke-width="1.5" stroke-linejoin="round"/><path d="M143 152Q150 158 157 152M183 152Q190 158 197 152" stroke="#1E2430" stroke-width="3" stroke-linecap="round" fill="none"/><ellipse cx="138" cy="166" rx="7" ry="4" fill="#F4B6A6"/><ellipse cx="202" cy="166" rx="7" ry="4" fill="#F4B6A6"/><ellipse cx="148" cy="236" rx="11" ry="24" transform="rotate(-50 148 236)" fill="#1E2430" stroke="#465066" stroke-width="2"/><ellipse cx="192" cy="236" rx="11" ry="24" transform="rotate(50 192 236)" fill="#1E2430" stroke="#465066" stroke-width="2"/><circle cx="170" cy="226" r="15" fill="#F28C28" stroke="#3A2A1E" stroke-width="2"/><path d="M170 211Q178 204 182 210Q176 214 170 211Z" fill="#4E9A51"/>') },
  { name: '커피챗 테이블 장면', note: '테이블 맞은편에 방문자 몫 한 잔', bg: '#F3E3CF', wide: true,
    art: svg('<circle cx="60" cy="60" r="26" fill="#FFF4E6"/><path d="M60 34V10" stroke="#8A5A3C" stroke-width="3" fill="none"/><g transform="translate(30,-14)">' + body + jacket('#C98B5A', '#3A2A1E') + vFront + '<ellipse cx="92" cy="226" rx="14" ry="36" transform="rotate(14 92 226)" fill="#C98B5A" stroke="#3A2A1E" stroke-width="2"/><ellipse cx="240" cy="222" rx="14" ry="34" transform="rotate(-48 240 222)" fill="#C98B5A" stroke="#3A2A1E" stroke-width="2"/><path d="M281 204a8 8 0 010 16" fill="none" stroke="#3A2A1E" stroke-width="3"/><rect x="254" y="196" width="28" height="30" rx="5" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="2"/><path d="M262 188q4-6 0-12M274 188q4-6 0-12" fill="none" stroke="#8A5A3C" stroke-width="2" stroke-linecap="round"/>' + beak + eyes + blush + roundGlasses + '</g><rect x="20" y="262" width="360" height="16" rx="4" fill="#8A5A3C"/><rect x="40" y="278" width="320" height="26" fill="#6E4630"/><ellipse cx="122" cy="262" rx="30" ry="6" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="2"/><path d="M143 236a8 8 0 010 16" fill="none" stroke="#3A2A1E" stroke-width="3"/><path d="M102 232H144V248C144 256 138 260 130 260H116C108 260 102 256 102 248Z" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="2" stroke-linejoin="round"/><ellipse cx="123" cy="233" rx="19" ry="4" fill="#8A5A3C"/><path d="M116 222q4-6 0-12M130 222q4-6 0-12" fill="none" stroke="#8A5A3C" stroke-width="2" stroke-linecap="round"/>', '0 60 400 246') }
];

const card = p => `<figure class="${p.wide ? 'wide' : ''}" style="background:${p.bg}">${p.art}<b>${p.name}</b><span>${p.note}</span>${p.tag ? `<em>${p.tag}</em>` : ''}</figure>`;
document.getElementById('live').innerHTML = live.map(card).join('');
document.getElementById('sketch').innerHTML = sketch.map(card).join('');
</script>
<script src="https://humgut1.github.io/home.js" defer></script>
