<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>옷 갈아입는 포트폴리오 시안</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
/* 배치: 화면 3개(고르기 → 옷 입기 → 본문)가 한 파일에 있고, data-mode 하나가 색·글꼴·모서리를 통째로 갈아 끼운다 */
:root { color-scheme: light; }
[data-mode="none"] {
  --bg: #15171C; --fg: #F1EEE8; --muted: #A9A6A0; --accent: #F1EEE8; --on-accent: #15171C;
  --soft: #23262E; --card: #1C1F26; --line: #343843;
  --display: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --radius: 12px; --bw: 1px; --shadow: none; --ease: ease-out; --dur: .2s;
}
[data-mode="work"] {
  --bg: #F6F8FB; --fg: #14213D; --muted: #55627A; --accent: #1F4E9C; --on-accent: #FFFFFF;
  --soft: #DCE5F2; --card: #FFFFFF; --line: #C9D3E3;
  --display: "Noto Serif KR", "Nanum Myeongjo", "Batang", serif;
  --radius: 6px; --bw: 1px; --shadow: none; --ease: ease-out; --dur: .2s;
}
[data-mode="play"] {
  --bg: #FFF4E6; --fg: #3A2A1E; --muted: #7A5F4C; --accent: #C4501B; --on-accent: #FFFFFF;
  --soft: #FFD9B8; --card: #FFFBF5; --line: #3A2A1E;
  --display: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --radius: 20px; --bw: 2px; --shadow: 4px 4px 0 #3A2A1E; --ease: cubic-bezier(.3,1.5,.5,1); --dur: .4s;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: "Pretendard", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: 16px; line-height: 1.65; word-break: keep-all;
  transition: background .3s;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.wrap { max-width: 960px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* 캐릭터: 얼굴은 같고 목 아래만 바뀐다 */
.ch { display: block; width: 100%; height: auto; overflow: visible; }
.ch .part { opacity: 0; transform: translateY(-14px); transform-box: fill-box; transition: opacity .3s, transform .4s cubic-bezier(.3,1.5,.5,1); }
.ch[data-outfit="work"] .p-shirt, .ch[data-outfit="work"] .p-tie, .ch[data-outfit="work"] .p-spark,
.ch[data-outfit="play"] .p-hoodie, .ch[data-outfit="play"] .p-hood, .ch[data-outfit="play"] .p-mug { opacity: 1; transform: none; }
.ch.dressing:not(.s1) .p-shirt, .ch.dressing:not(.s1) .p-hoodie, .ch.dressing:not(.s1) .p-hood,
.ch.dressing:not(.s3) .p-spark,
.ch.dressing:not(.s2) .p-tie, .ch.dressing:not(.s2) .p-mug { opacity: 0; transform: translateY(-14px); }
.ch .eye { transform-box: fill-box; transform-origin: center; animation: blink 4.2s infinite; }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 97% { transform: scaleY(.1); } }

/* 화면 1: 고르기 */
#pick { min-height: 100%; display: grid; place-items: center; padding-block: 40px; }
.pick-in { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 28px; text-align: center; }
.pick-in h1 { margin: 0; font-size: clamp(28px, 6vw, 44px); font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
.pick-in p { margin: 0; color: var(--muted); }
.cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; }
.card {
  flex: 1 1 220px; max-width: 280px; padding: 24px 20px 22px; text-align: center;
  background: var(--bg); color: var(--fg); border: 2px solid transparent; border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  transition: transform var(--dur) var(--ease), border-color .2s;
}
.card:hover, .card:focus-visible { transform: translateY(-6px); border-color: var(--accent); }
.card .ch { width: 112px; margin-bottom: 8px; }
.card strong { font-family: var(--display); font-size: 24px; font-weight: 700; line-height: 1.3; }
.card span { font-size: 14px; color: var(--muted); }
.skip { background: none; border: 0; padding: 8px 4px; color: var(--muted); text-decoration: underline; text-underline-offset: 4px; }
.skip:hover { color: var(--fg); }

/* 화면 2: 옷 입는 중 */
#loading {
  position: fixed; inset: 0; z-index: 50; background: var(--bg); color: var(--fg);
  display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px));
  transition: opacity .25s;
}
#loading.out { opacity: 0; }
.load-in { width: min(100%, 360px); display: flex; flex-direction: column; align-items: center; gap: 18px; text-align: center; }
#stage { width: 150px; transition: transform .4s cubic-bezier(.3,1.5,.5,1); }
#stage.pose-work { transform: translateY(-6px) scale(1.04); }
#stage.pose-play { transform: rotate(-6deg); }
#msg { margin: 0; min-height: 1.5em; font-family: var(--display); font-size: 24px; font-weight: 700; }
.bar { width: 100%; height: 6px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; }
.tip { margin: 8px 0 0; font-size: 14px; color: var(--muted); }
.tip b { display: block; color: var(--fg); font-weight: 700; letter-spacing: .04em; }
.skip-load { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); font-size: 13px; color: var(--muted); }

/* 화면 3: 본문 */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: var(--bw) solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 16px; min-height: 60px; }
.brand { font-family: var(--display); font-size: 20px; font-weight: 700; margin-right: auto; }
.top nav { display: flex; gap: 18px; font-size: 14px; }
.top nav a { color: var(--muted); text-decoration: none; }
.top nav a:hover { color: var(--fg); }
#swap { display: flex; align-items: center; gap: 8px; padding: 4px 14px 4px 6px; background: var(--card); border: var(--bw) solid var(--line); border-radius: 99px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); }
#swap .ch { width: 30px; }
#swap .ch .eye { animation: none; }
@media (max-width: 560px) { .top nav { display: none; } }

main { display: flex; flex-direction: column; gap: 72px; padding-block: 48px 72px; }
main > section { order: var(--o); }
[data-mode="play"] main > .sec-exp { order: 6; }
h2 { margin: 0 0 20px; font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.3; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 220px; gap: 32px; align-items: center; }
.kicker { margin: 0 0 12px; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
.hero h1 { margin: 0 0 16px; font-family: var(--display); font-size: clamp(30px, 5.4vw, 48px); font-weight: 700; line-height: 1.25; letter-spacing: -.01em; text-wrap: balance; }
.hero .lead { margin: 0 0 24px; max-width: 34em; font-size: 18px; color: var(--muted); }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { padding: 11px 22px; border-radius: var(--radius); border: var(--bw) solid var(--line); background: var(--card); font-weight: 700; box-shadow: var(--shadow); transition: transform var(--dur) var(--ease); }
.btn.main { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
[data-mode="play"] .btn.main { border-color: var(--line); }
.btn:hover { transform: translateY(-2px); }
.me { position: relative; }
.me button { display: block; width: 100%; padding: 0; background: none; border: 0; }
.bubble { position: absolute; left: 50%; top: -6px; transform: translate(-50%, -100%); width: max-content; max-width: 220px; padding: 8px 14px; background: var(--card); border: var(--bw) solid var(--line); border-radius: var(--radius); font-size: 14px; box-shadow: var(--shadow); }
@media (max-width: 680px) { .hero { grid-template-columns: 1fr; } .me { width: 150px; order: -1; margin-top: 36px; } .bubble { left: 0; transform: translate(0, -100%); } }

.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; }
.num { padding: 20px; background: var(--soft); border-radius: var(--radius); }
.num b { display: block; font-family: var(--display); font-size: 34px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.num span { font-size: 14px; color: var(--muted); }
.projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
.proj { padding: 22px; background: var(--card); border: var(--bw) solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.proj small { font-size: 13px; color: var(--muted); }
.proj h3 { margin: 0; font-size: 19px; line-height: 1.4; }
.proj p { margin: 0; }
.proj details { margin-top: auto; font-size: 14px; color: var(--muted); }
.proj summary { cursor: pointer; color: var(--accent); font-weight: 700; }
.rows { display: grid; gap: 0; border-top: var(--bw) solid var(--line); }
.row { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 16px; padding: 16px 0; border-bottom: var(--bw) solid var(--line); }
.row time { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.row b { display: block; }
.row span { color: var(--muted); font-size: 15px; }
@media (max-width: 480px) { .row { grid-template-columns: 1fr; gap: 2px; } }
.ways { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px; margin: 0; padding: 0; list-style: none; }
.ways b { display: block; margin-bottom: 4px; font-size: 17px; }
.ways span { color: var(--muted); font-size: 15px; }
.contact { padding: 36px 28px; background: var(--soft); border-radius: var(--radius); }
.contact p { margin: 0 0 20px; max-width: 34em; }
.addr { display: inline-block; margin-bottom: 20px; font-weight: 700; font-size: 18px; user-select: all; }
footer { border-top: var(--bw) solid var(--line); padding-block: 28px 40px; }
footer .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 16px; }
footer .ch { width: 56px; }
footer p { margin: 0; flex: 1 1 200px; font-size: 14px; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div id="pick">
  <div class="wrap pick-in">
    <h1>어떻게 오셨어요?</h1>
    <p>고르신 쪽에 맞춰 옷을 갈아입고 나올게요.</p>
    <div class="cards">
      <button class="card" id="card-work" data-mode="work" data-go="work">
        <span data-ch="work"></span>
        <strong>일로 왔어요</strong>
        <span>채용 담당자 · 면접관 · 협업 제안</span>
      </button>
      <button class="card" id="card-play" data-mode="play" data-go="play">
        <span data-ch="play"></span>
        <strong>커피챗 하러 왔어요</strong>
        <span>친구 · 지인 · 편하게 얘기 나눌 분</span>
      </button>
    </div>
    <button class="skip" id="skip-pick">바쁘시면 바로 보기 →</button>
  </div>
</div>

<div id="loading" hidden>
  <div class="load-in">
    <div id="stage"></div>
    <p id="msg" aria-live="polite"></p>
    <div class="bar"><i id="bar"></i></div>
    <p class="tip"><b>알고 계셨나요?</b><span id="tip"></span></p>
  </div>
  <span class="skip-load">아무 곳이나 누르면 건너뜁니다</span>
</div>

<div id="site" hidden>
  <header class="top">
    <div class="wrap">
      <span class="brand" id="brand"></span>
      <nav id="nav"></nav>
      <button id="swap" aria-label="옷 갈아입기: 다른 말투로 보기"></button>
    </div>
  </header>
  <main class="wrap" id="main"></main>
  <footer>
    <div class="wrap">
      <span id="foot-ch"></span>
      <p id="foot-msg"></p>
      <button class="btn" id="restart">처음 화면으로</button>
    </div>
  </footer>
</div>

<script>
const $ = s => document.querySelector(s);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* guest = 고르기 화면의 방문자 펭귄(면접관·커피챗 상대), 그 밖은 모두 '나' 펭귄(지원자) */
function ch(outfit, cls, guest) {
  const work = outfit === 'work' && guest;
  const knit = guest ? '#C98B5A' : '#E2703A';
  const off = ' display="none"';
  return `<svg class="ch ${cls || ''}" data-outfit="${outfit}" viewBox="62 96 220 214" aria-hidden="true">
    <ellipse cx="145" cy="298" rx="20" ry="8" fill="#F2A33A"/>
    <ellipse cx="195" cy="298" rx="20" ry="8" fill="#F2A33A"/>
    <ellipse cx="170" cy="200" rx="80" ry="98" fill="#1E2430"/>
    <ellipse cx="170" cy="222" rx="54" ry="72" fill="#F7F5F0"/>
    <ellipse cx="170" cy="152" rx="52" ry="36" fill="#F7F5F0"/>
    <ellipse cx="94" cy="222" rx="13" ry="38" transform="rotate(14 94 222)" fill="#1E2430" stroke="#465066" stroke-width="2"/>
    ${work
      ? '<ellipse cx="236" cy="180" rx="13" ry="38" transform="rotate(-36 236 180)" fill="#1E2430" stroke="#465066" stroke-width="2"/>'
      : '<ellipse cx="246" cy="222" rx="13" ry="38" transform="rotate(-14 246 222)" fill="#1E2430" stroke="#465066" stroke-width="2"/>'}
    <path d="M161 166H179L170 175Z" fill="#F2A33A" stroke="#C97F1E" stroke-width="1.5" stroke-linejoin="round"/>
    <circle class="eye" cx="150" cy="150" r="4" fill="#1E2430"/>
    <circle class="eye" cx="190" cy="150" r="4" fill="#1E2430"/>
    <g class="part p-shirt">
      <path d="M148 190L168 198L157 210Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="2" stroke-linejoin="round"/>
      <path d="M192 190L172 198L183 210Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="2" stroke-linejoin="round"/>
      <path d="M163 197H177L174 207H166Z" fill="#1F4E9C"/>
      <path d="M166 207H174L179 244L170 254L161 244Z" fill="#1F4E9C"/>
    </g>
    <g class="part p-tie"${guest ? off : ''}>
      <g transform="rotate(-8 80 256)">
        <rect x="66" y="238" width="28" height="36" rx="2" fill="#FFFFFF" stroke="#1E2430" stroke-width="2"/>
        <path d="M71 247H82M71 254H89M71 260H89M71 266H85" stroke="#8FA3C4" stroke-width="2" fill="none"/>
      </g>
    </g>
    <g class="part p-tie"${guest ? '' : off}>
      <path d="M164 149H176" stroke="#1E2430" stroke-width="3" fill="none"/>
      <path d="M124 138L164 143L162 161L129 159Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="3" stroke-linejoin="round"/>
      <path d="M216 138L176 143L178 161L211 159Z" fill="#FFFFFF" stroke="#1E2430" stroke-width="3" stroke-linejoin="round"/>
      <path d="M134 156L144 143M142 157L152 144" stroke="#BFD3F2" stroke-width="2" fill="none"/>
    </g>
    <g class="part p-spark"${guest ? off : ''}>
      <path d="M234 126C229 136 229 143 234 143C239 143 239 136 234 126Z" fill="#7FB7E6"/>
    </g>
    <g class="part p-spark"${guest ? '' : off}>
      <path d="M226 112L230 126L244 130L230 134L226 148L222 134L208 130L222 126Z" fill="#FFFFFF" stroke="#1F4E9C" stroke-width="1.5" stroke-linejoin="round"/>
      <path d="M252 104L254 111L261 113L254 115L252 122L250 115L243 113L250 111Z" fill="#FFFFFF" stroke="#1F4E9C" stroke-width="1.5" stroke-linejoin="round"/>
    </g>
    <g class="part p-hoodie">
      <path d="M96 215C104 190 136 184 170 184C204 184 236 190 244 215C252 250 240 290 170 292C100 290 88 250 96 215Z" fill="${knit}" stroke="#3A2A1E" stroke-width="2"/>
      <path d="M152 185L170 232L188 185Z" fill="#F7F5F0" stroke="#3A2A1E" stroke-width="2" stroke-linejoin="round"/>
      <path d="M170 232V290" stroke="#3A2A1E" stroke-width="2" fill="none"/>
      <circle cx="170" cy="248" r="3" fill="#3A2A1E"/>
      <ellipse cx="92" cy="226" rx="14" ry="36" transform="rotate(14 92 226)" fill="${knit}" stroke="#3A2A1E" stroke-width="2"/>
      <ellipse cx="248" cy="226" rx="14" ry="36" transform="rotate(-14 248 226)" fill="${knit}" stroke="#3A2A1E" stroke-width="2"/>
    </g>
    <g class="part p-mug">
      <path d="M267 246a7 7 0 010 14" fill="none" stroke="#3A2A1E" stroke-width="3"/>
      <rect x="242" y="238" width="26" height="28" rx="5" fill="#FFFFFF" stroke="#3A2A1E" stroke-width="2"/>
      <path d="M250 230q4-6 0-12M260 230q4-6 0-12" fill="none" stroke="#8A5A3C" stroke-width="2" stroke-linecap="round"/>
    </g>
    ${work ? '' : '<ellipse cx="134" cy="166" rx="7" ry="4" fill="#F4B6A6"/><ellipse cx="206" cy="166" rx="7" ry="4" fill="#F4B6A6"/>'}
    ${guest ? '' : '<path d="M166 105C160 88 172 80 184 86C177 89 175 96 178 105Z" fill="#1E2430"/>'}
    ${!guest || work ? '' : `<circle cx="150" cy="150" r="14" fill="none" stroke="#1E2430" stroke-width="3"/><circle cx="190" cy="150" r="14" fill="none" stroke="#1E2430" stroke-width="3"/>
      <path d="M164 150H176" stroke="#1E2430" stroke-width="3" fill="none"/>`}
  </svg>`;
}

/* 같은 사실, 두 가지 말투. 이름과 내용은 모두 예시 */
const COPY = {
  work: {
    brand: '홍길동', nav: ['프로젝트', '경력', '연락처'], swap: '옷 갈아입기',
    kicker: '인사 담당자 · 시안용 예시 내용',
    h1: '안녕하십니까, 홍길동입니다.',
    lead: '새로 온 사람이 일에 빨리 적응하도록 절차를 설계합니다. 3년간 온보딩과 채용 운영을 맡았습니다.',
    cta: ['이력서 받기', '메일 보내기'], bubble: '잘 부탁드립니다.',
    nums: [['3년', '인사 업무 경력'], ['4건', '주도한 프로젝트'], ['5일 → 2일', '온보딩 처리 기간']],
    hProj: '프로젝트', more: '자세히 보기',
    proj: [
      ['2025 · 기획과 운영', '온보딩 절차 재설계', '입사 첫 주 절차를 다시 설계해 처리 기간을 5일에서 2일로 줄였습니다.', '문제: 서류와 계정 발급이 부서마다 따로 진행됐습니다. 한 일: 순서를 하나로 묶고 확인표를 만들었습니다.'],
      ['2024 · 문안 작성', '채용 공고 문장 개선', '공고를 지원자 관점으로 고쳐 써서 끝까지 지원하는 비율을 높였습니다.', '문제: 공고가 회사 용어로만 쓰여 있었습니다. 한 일: 하는 일과 조건을 앞에 두고 문장을 줄였습니다.'],
      ['2024 · 문서 정리', '사내 안내서 통합', '흩어진 안내 문서를 한 곳에 모아 반복 문의를 줄였습니다.', '문제: 같은 질문이 매일 들어왔습니다. 한 일: 질문을 모아 찾기 쉬운 안내서 하나로 만들었습니다.']
    ],
    hExp: '경력', exp: [['2023 – 현재', '가나다 주식회사 · 인사팀', '온보딩, 채용 운영, 사내 안내 문서 담당'], ['2019 – 2023', '한국대학교 · 경영학 전공', '조직 행동 수업 조교, 학회 운영']],

    hContact: '연락처', contact: '편하신 방법으로 연락 주시면 하루 안에 답장드리겠습니다.', cbtn: ['주소 복사', '이력서 받기'],
    foot: '끝까지 읽어 주셔서 감사합니다.',
    load: ['넥타이 고쳐 매는 중…', '이력서 챙기는 중…', '심호흡하는 중…', '잘 부탁드립니다.'], again: '또요…? 옷이 닳겠습니다.',
    tips: ['이 사이트는 기획부터 제작까지 직접 했습니다.', '옷을 갈아입어도 내용은 같습니다. 말투만 달라요.', '떨리지 않습니다. 땀은 더워서 나는 겁니다.', '오른쪽 위 버튼으로 언제든 옷을 갈아입힐 수 있습니다.'],
    egg: '여기까지 찾으셨군요. 꼼꼼하십니다.'
  },
  play: {
    brand: '길동이네', nav: ['한 일', '거쳐 온 곳', '연락'], swap: '옷 갈아입기',
    kicker: '사람 챙기는 일 3년째 · 시안용 예시 내용',
    h1: '안녕! 나 길동이야.',
    lead: '요즘은 새로 온 사람들이 회사에 빨리 적응하게 돕는 일을 해. 벌써 3년째야.',
    cta: ['연락해!', '밥 한번 먹자'], bubble: '네 커피도 시켜 놨어!',
    nums: [['3년', '이 일 한 지'], ['4건', '끝까지 해낸 큰일'], ['5일 → 2일', '줄여 준 대기 시간']],
    hProj: '이런 걸 했어', more: '뒷이야기',
    proj: [
      ['2025 · 내가 판 벌림', '온보딩 절차 재설계', '일주일 걸리던 걸 이틀로 줄였어. 이거 하느라 한 달을 야근했지만.', '부서마다 따로 하던 걸 한 줄로 세웠어. 확인표 하나 만든 게 제일 잘한 일이야.'],
      ['2024 · 글 고치기', '채용 공고 문장 개선', '공고를 사람 말로 다시 썼더니 지원자가 늘더라. 신기했어.', '회사 용어를 다 빼고, 뭐 하는 자리인지부터 썼어. 그게 다야.'],
      ['2024 · 정리 정돈', '사내 안내서 통합', '같은 질문을 하루에 열 번 받다가 참다못해 안내서를 만들었어.', '질문을 다 모아 보니 종류는 스무 개가 안 되더라. 그걸 한 곳에 적었어.']
    ],
    hExp: '거쳐 온 곳', exp: [['2023 – 지금', '가나다 주식회사 · 인사팀', '새 식구 챙기기, 사람 뽑기, 안내서 쓰기'], ['2019 – 2023', '한국대학교 · 경영학', '수업 조교 하고 학회도 굴렸어']],
    hWays: '같이 일해 본 사람들이 하는 말', ways: [['"답이 빨라"', '되는지 안 되는지부터 말해 주는 편이야.'], ['"숫자를 좋아해"', '바꾸기 전이랑 후를 꼭 재 봐.'], ['"뭐든 적어 둬"', '나중에 또 물어보는 게 미안해서 그래.']],
    hExtra: '요즘 근황', extra: [['취미', '주말마다 동네 빵집을 하나씩 가 보는 중이야.'], ['읽는 책', '일 얘기 없는 소설만 골라 읽어.'], ['가고 싶은 곳', '겨울에 눈 많이 오는 곳.']],
    hContact: '연락해', contact: '심심하면 연락해. 답장은 빠른 편이야.', cbtn: ['주소 복사', '밥 한번 먹자'],
    foot: '여기까지 봐 줘서 고마워. 또 놀러 와!',
    load: ['후드티 걸치는 중…', '커피 두 잔 주문하는 중…', '창가 자리 맡는 중…', '여기야, 앉아!'], again: '또? 옷 닳겠다!',
    tips: ['사실 이 후드티는 3일째 입는 중이야.', '"일로 왔어요"를 누르면 내가 존댓말을 써.', '옷만 바뀌고 내용은 똑같아.', '날 다섯 번 누르면 무슨 일이 생겨.'],
    egg: '오, 이걸 찾았네! 눈썰미 좋다.'
  }
};

let mode = null, pending = null, timers = [], swaps = 0, pokes = 0, tipAt = 0;

function render(m) {
  const c = COPY[m];
  $('#brand').textContent = c.brand;
  $('#nav').innerHTML = ['proj', 'exp', 'contact'].map((id, i) => `<a href="#sec-${id}" data-jump="sec-${id}">${c.nav[i]}</a>`).join('');
  $('#swap').innerHTML = ch(m === 'work' ? 'play' : 'work') + `<span>${c.swap}</span>`;
  $('#main').innerHTML = `
    <section class="hero" style="--o:1">
      <div>
        <p class="kicker">${c.kicker}</p>
        <h1 tabindex="-1" id="hello">${c.h1}</h1>
        <p class="lead">${c.lead}</p>
        <div class="btns"><button class="btn main">${c.cta[0]}</button><button class="btn" data-jump="sec-contact">${c.cta[1]}</button></div>
      </div>
      <div class="me"><div class="bubble" id="bubble">${c.bubble}</div><button id="poke" aria-label="캐릭터">${ch(m)}</button></div>
    </section>
    <section style="--o:2"><div class="nums">${c.nums.map(n => `<div class="num"><b>${n[0]}</b><span>${n[1]}</span></div>`).join('')}</div></section>
    <section id="sec-proj" style="--o:3"><h2>${c.hProj}</h2><div class="projects">${c.proj.map(p => `<article class="proj"><small>${p[0]}</small><h3>${p[1]}</h3><p>${p[2]}</p><details><summary>${c.more}</summary><p>${p[3]}</p></details></article>`).join('')}</div></section>
    <section id="sec-exp" class="sec-exp" style="--o:4"><h2>${c.hExp}</h2><div class="rows">${c.exp.map(e => `<div class="row"><time>${e[0]}</time><div><b>${e[1]}</b><span>${e[2]}</span></div></div>`).join('')}</div></section>
    <section style="--o:5"><h2>${c.hWays}</h2><ul class="ways">${c.ways.map(w => `<li><b>${w[0]}</b><span>${w[1]}</span></li>`).join('')}</ul></section>
    <section style="--o:5"><h2>${c.hExtra}</h2><div class="rows">${c.extra.map(e => `<div class="row"><time>${e[0]}</time><div><span>${e[1]}</span></div></div>`).join('')}</div></section>
    <section id="sec-contact" style="--o:7"><div class="contact"><h2>${c.hContact}</h2><p>${c.contact}</p><span class="addr" id="addr">hello@example.com</span><div class="btns"><button class="btn main" id="copy">${c.cbtn[0]}</button><button class="btn">${c.cbtn[1]}</button></div></div></section>`;
  $('#foot-ch').innerHTML = ch(m);
  $('#foot-msg').textContent = c.foot + ' (시안: 이름과 내용은 예시입니다)';
  pokes = 0;
}

function apply(m) {
  if (mode === m && !$('#site').hidden) return;
  mode = m;
  document.body.dataset.mode = m;
  render(m);
  $('#pick').hidden = true;
  $('#site').hidden = false;
  try { history.replaceState(null, '', '#' + m); } catch (e) {}
}

function later(ms, fn) { timers.push(setTimeout(fn, ms)); }

function go(m, o) {
  o = o || {};
  const c = COPY[m], short = !!o.short || reduce, L = $('#loading'), stage = $('#stage'), bar = $('#bar');
  timers.forEach(clearTimeout); timers = [];
  pending = m;
  L.dataset.mode = m; L.classList.remove('out'); L.hidden = false;
  const x = o.x == null ? innerWidth / 2 : o.x, y = o.y == null ? innerHeight / 2 : o.y;
  L.style.transition = 'none';
  L.style.clipPath = `circle(0px at ${x}px ${y}px)`;
  void L.offsetWidth;
  L.style.transition = reduce ? 'none' : 'clip-path .45s ease-out, opacity .25s';
  L.style.clipPath = `circle(150vmax at ${x}px ${y}px)`;

  stage.className = '';
  stage.innerHTML = ch(m, 'dressing' + (short ? ' s1 s2 s3' : ''));
  const fig = stage.firstElementChild, msg = $('#msg');
  $('#tip').textContent = c.tips[tipAt++ % c.tips.length];
  const total = short ? 800 : 2100;
  bar.style.transition = 'none'; bar.style.width = '0';
  void bar.offsetWidth;
  bar.style.transition = `width ${total}ms linear`; bar.style.width = '100%';

  if (short) {
    msg.textContent = swaps >= 3 ? c.again : c.load[3];
    stage.classList.add('pose-' + m);
  } else {
    msg.textContent = c.load[0];
    later(80, () => fig.classList.add('s1'));
    later(600, () => { msg.textContent = c.load[1]; fig.classList.add('s2'); });
    later(1200, () => { msg.textContent = c.load[2]; fig.classList.add('s3'); stage.classList.add('pose-' + m); });
    later(1750, () => { msg.textContent = c.load[3]; });
  }
  later(450, () => apply(m));
  later(total, done);
}

function done() {
  if (!pending) return;
  timers.forEach(clearTimeout); timers = [];
  apply(pending); pending = null;
  const L = $('#loading');
  L.classList.add('out');
  setTimeout(() => { if (!pending) { L.hidden = true; L.classList.remove('out'); } }, reduce ? 0 : 260);
}

function center(el) { const r = el.getBoundingClientRect(); return { x: r.left + r.width / 2, y: r.top + r.height / 2 }; }

document.querySelectorAll('[data-ch]').forEach(el => { el.outerHTML = ch(el.dataset.ch, '', true); });
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(b.dataset.go, center(b))));
$('#skip-pick').addEventListener('click', () => { apply('work'); scrollTo(0, 0); });
$('#loading').addEventListener('click', done);
addEventListener('keydown', e => { if (pending && !e.repeat) done(); });
$('#swap').addEventListener('click', e => { swaps++; go(mode === 'work' ? 'play' : 'work', Object.assign({ short: true }, center(e.currentTarget))); });
$('#restart').addEventListener('click', () => {
  mode = null; document.body.dataset.mode = 'none';
  $('#site').hidden = true; $('#pick').hidden = false; scrollTo(0, 0);
  try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  $('#card-work').focus();
});
$('#site').addEventListener('click', e => {
  const j = e.target.closest('[data-jump]');
  if (j) { e.preventDefault(); const t = document.getElementById(j.dataset.jump); if (t) t.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'start' }); return; }
  if (e.target.closest('#poke')) { if (++pokes === 5) $('#bubble').textContent = COPY[mode].egg; return; }
  if (e.target.closest('#copy')) {
    const b = e.target.closest('#copy'), ok = () => { b.textContent = '복사했습니다'; };
    try { navigator.clipboard.writeText($('#addr').textContent).then(ok, () => getSelection().selectAllChildren($('#addr'))); }
    catch (err) { getSelection().selectAllChildren($('#addr')); }
  }
});

document.body.dataset.mode = 'none';
const h = location.hash.slice(1);
if (h === 'work' || h === 'play') go(h, { short: true });
</script>
